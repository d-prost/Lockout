name: Publish production-oriented v1.0.4
on:
  workflow_run:
    workflows: ["Windows PowerShell 5.1 tests"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: initial-release-v1-0-4
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish only after successful Windows CI on current main
        env:
          GH_TOKEN: ${{ github.token }}
          CI_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$(git rev-parse origin/main)" != "$CI_COMMIT" ]; then
            echo "Successful CI commit is no longer the main branch head; skipping stale release."
            exit 0
          fi
          if gh release view v1.0.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.4 already exists; no changes."
            exit 0
          fi
          gh release create v1.0.4 --repo "$GITHUB_REPOSITORY" \
            --target "$CI_COMMIT" \
            --title "AD Account Lockout Monitor & Investigator v1.0.4" \
            --notes-file docs/RELEASE_NOTES_v1.0.4.md \
            --latest
          gh release view v1.0.4 --repo "$GITHUB_REPOSITORY" --json url,tagName
